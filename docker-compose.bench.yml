# ARTEX Tencent TSec Benchmark evaluation image -- one-click local build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in the foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also delete the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the network with the physical host: the container uses the host network stack directly,
    # so it can connect directly to the target network on the host/VPN.
    # In host mode there's no ports mapping; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and the internal PostgreSQL 5432 -- make sure these three ports are free on the host (stop services occupying them before local testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
